name: build-binaries

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:
  workflow_call:

jobs:
  build-api-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.25.8
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
          cache-dependency-path: services/api-gateway/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux go build -o app ./cmd/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-binary
          path: app
          retention-days: 1

  build-info-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/info-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup GO 1.24.7
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache-dependency-path: services/info-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run:  CGO_ENABLED=0 GOOS=linux go build -o app ./cmd/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: info-service-binary
          path: app
          retention-days: 1

  build-ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # cache: 'pip'
          # cache-dependency-path: services/ml-service/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ml-service-binary
          path: .
          retention-days: 1

  build-image-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/image-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.25.8
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
          cache-dependency-path: services/image-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux go build -o app ./cmd/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-service-binary
          path: app
          retention-days: 1

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm rebuild

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            .next
            public
            package.json
            package-lock.json
            node_modules
          retention-days: 1