      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/mushroom-ml-service:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build docker image
        run: docker build -f Dockerfile.runtime -t ${{ env.IMAGE_TAG }} .

      - name: Docker push
        run: docker push ${{ env.IMAGE_TAG }}

  docker-image-service:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    defaults:
      working-directory: services/image-service
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v5
        with:
          name: image-service-binary
          path: bin

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/mushroom-image-service:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build docker image
        run: docker build -f Dockerfile.runtime -t ${{ env.IMAGE_TAG }} .

      - name: Docker push
        run: docker push ${{ env.IMAGE_TAG }}

  docker-frontend:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
