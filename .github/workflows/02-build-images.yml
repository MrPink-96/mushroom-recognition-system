name: build-images

on:
  workflow_run:
    workflows: ["build-binaries"]
    types: ["completed"]
  workflow_dispatch:

jobs:
  docker-api-gateway:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    defaults:
      working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v5
        with:
          name: api-gateway-binary
          path: bin

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/mushroom-api-gateway:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build docker image
        run: docker build -f Dockerfile.runtime -t ${{ env.IMAGE_TAG }} .

      - name: Docker push
        run: docker push ${{ env.IMAGE_TAG }}

  docker-info-service:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    defaults:
      working-directory: services/info-service
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
